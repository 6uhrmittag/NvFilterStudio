name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    # WPF needs Windows. The Core library and its tests are plain net10.0 and
    # would run anywhere, but one runner keeps the matrix honest.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        # On a v* tag the published build carries that exact version, so a
        # downloaded exe can always be traced back to a release. Untagged builds
        # keep the VersionPrefix from Directory.Build.props.
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        # Warnings are errors and analyzers run in-build, so this step is also
        # the lint gate.
        run: dotnet build --configuration Release --no-restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Test
        # Fixtures are synthetic, so the suite needs no NVIDIA install and
        # nothing about the runner's hardware.
        run: >
          dotnet test --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ${{ github.workspace }}/artifacts/test-results
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: warn

      - name: Publish single-file executable
        # No trimming: WPF does not trim cleanly, and a broken published build
        # is worse than a larger one. Compression is the safe win instead -
        # it halves the download (134 MB -> 62 MB) at the cost of a slightly
        # slower first start, and the compressed build is verified to run.
        run: >
          dotnet publish src/NvFilterStudio.App
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=embedded
          ${{ steps.version.outputs.value && format('-p:Version={0}', steps.version.outputs.value) || '' }}
          --output ${{ github.workspace }}/artifacts/publish

      - name: Publish the CLI
        # Shipped too: the bug report form asks people to run `nvfs status`,
        # which is unreasonable if the only way to get it is to build from
        # source. Not compressed - it is small, and start-up speed matters more
        # for something run from a prompt.
        run: >
          dotnet publish tools/NvFilterStudio.Cli
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=embedded
          ${{ steps.version.outputs.value && format('-p:Version={0}', steps.version.outputs.value) || '' }}
          --output ${{ github.workspace }}/artifacts/publish-cli

      - name: Upload application
        uses: actions/upload-artifact@v5
        with:
          name: NvFilterStudio-win-x64
          path: artifacts/publish/NvFilterStudio.exe
          if-no-files-found: error

      - name: Upload CLI
        uses: actions/upload-artifact@v5
        with:
          name: nvfs-cli-win-x64
          path: artifacts/publish-cli/nvfs.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Provenance attestation: id-token signs through Sigstore, attestations
      # publishes the result. Both are free on a public repository.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v5

      - name: Download application
        uses: actions/download-artifact@v5
        with:
          name: NvFilterStudio-win-x64
          path: dist

      - name: Download CLI
        uses: actions/download-artifact@v5
        with:
          name: nvfs-cli-win-x64
          path: dist

      - name: Checksum the binaries
        # These are unsigned executables downloaded from a stranger, so there
        # has to be something to check them against out of band. GitHub records
        # a digest server-side but never shows it beside the download.
        working-directory: dist
        run: sha256sum NvFilterStudio.exe nvfs.exe | tee SHA256SUMS.txt

      - name: Attest build provenance
        # The binaries are unsigned, so a checksum only proves the download was
        # not corrupted - it says nothing about where the file came from, and it
        # is published by whoever published the binary. This is signed evidence
        # that these exact bytes came out of this workflow, at this commit, and
        # anyone can check it with:
        #   gh attestation verify NvFilterStudio.exe --repo <owner>/<repo>
        #
        # Before the release step on purpose: attesting afterwards could leave a
        # published release with no provenance if this fails.
        #
        # SHA256SUMS.txt is deliberately not a subject - it is derived from these
        # two files, so attesting it adds a subject without adding an assurance.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/NvFilterStudio.exe
            dist/nvfs.exe

      - name: Take the release notes from the changelog
        # generate_release_notes on its own produces a bare commit list, which
        # says nothing about why anyone should upgrade. The changelog already
        # says it, so use that as the body and let the generated list follow
        # underneath rather than keeping a second copy by hand.
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"

          # A literal prefix match rather than a regex built from the version:
          # the dots would be wildcards and the brackets need escaping that awk
          # warns about, and getting it subtly wrong yields an empty file rather
          # than an error.
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/       { exit }
            found                   { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "No CHANGELOG section for [$version] - add one before tagging." >&2
            exit 1
          fi

          cat notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NvFilterStudio.exe
            dist/nvfs.exe
            dist/SHA256SUMS.txt
          body_path: notes.md
          generate_release_notes: true
          # Everything here is verified on one machine, one GPU and one driver
          # version, and has never been through a driver update. Saying so in
          # the release notes while the flag claims otherwise would be the flag
          # winning.
          prerelease: true
