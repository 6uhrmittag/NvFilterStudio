name: Bug report
description: Something behaved wrong, crashed, or lost data
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time ♡

        **If your filters were lost or damaged, say so first and skip the rest.**
        Backups are in `%LOCALAPPDATA%\NvFilterStudio\backups\` — copy a folder
        from there over the store with the overlay off, and nothing is gone.

  - type: input
    id: version
    attributes:
      label: NvFilterStudio version
      description: Shown in the app header, next to the name.
      placeholder: v0.1.0
    validations:
      required: true

  - type: input
    id: nvidia
    attributes:
      label: NVIDIA App version and driver
      description: NVIDIA App → Settings → About. Driver from the same page or Device Manager.
      placeholder: App 11.0.9.251, driver 32.0.16.1664
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: NVIDIA App UI language
      description: >
        This matters more than it sounds. Filter labels are stored in the App's
        language, and non-Latin-1 languages cannot currently be written at all.
      placeholder: English / German / …
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true

  - type: textarea
    id: crash
    attributes:
      label: Crash log
      description: >
        If the app showed an error dialog it named a log file in
        `%LOCALAPPDATA%\NvFilterStudio\logs\`. Paste it here.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Before you attach anything
      options:
        - label: >
            I have not attached a raw copy of my NVIDIA store (`.log` / `.ldb`
            files). Those contain my NVIDIA account id and session GUIDs. An
            exported `.json` from the app is safe to share.
          required: true
